<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Edits</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:
        radial-gradient(circle at top, rgba(99,102,241,0.18), transparent 28%),
        linear-gradient(180deg, #0b0b14, #111827, #0a0a0a);
      color:white;
      min-height:100vh;
    }

    .container{
      max-width:1120px;
      margin:auto;
      padding:0 20px 50px;
    }

    header{
      text-align:center;
      padding:50px 20px 30px;
    }

    header h1{
      font-size:42px;
      margin-bottom:8px;
      color:#f8fafc;
      letter-spacing:0.5px;
    }

    header p{
      color:#cbd5e1;
      font-size:15px;
    }

    .hero-box{
      max-width:780px;
      margin:26px auto 0;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;
      padding:26px 22px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.18);
    }

    .hero-title{
      font-size:28px;
      margin-bottom:10px;
      color:#eef2ff;
      line-height:1.3;
    }

    .hero-text{
      font-size:14px;
      color:#cbd5e1;
      margin-bottom:8px;
      line-height:1.7;
    }

    .hero-sub{
      font-size:12px;
      color:#6b7280;
      letter-spacing:0.4px;
      margin-bottom:10px;
    }

    nav{
      margin-top:25px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .tab{
      padding:10px 18px;
      border:none;
      border-radius:20px;
      background:#6366f133;
      color:white;
      cursor:pointer;
      transition:0.2s ease;
      font-size:14px;
    }

    .tab:hover{
      background:#6366f155;
    }

    .tab.active{
      background:#6366f1;
    }

    .section{
      display:none;
      opacity:0;
      transform:translateY(8px);
      transition:opacity 0.25s ease, transform 0.25s ease;
    }

    .section.active{
      display:block;
      opacity:1;
      transform:translateY(0);
    }

    .section-title{
      text-align:center;
      color:#a5b4fc;
      margin-top:28px;
      font-size:28px;
    }

    .section-note{
      text-align:center;
      color:#94a3b8;
      font-size:13px;
      margin-top:6px;
      margin-bottom:14px;
    }

    .services{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      max-width:1000px;
      margin:28px auto 0;
    }

    .service-box{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:16px;
      padding:18px;
      text-align:center;
    }

    .service-box h3{
      font-size:16px;
      color:#eef2ff;
      margin-bottom:8px;
    }

    .service-box p{
      font-size:12px;
      color:#94a3b8;
      line-height:1.6;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:22px;
      max-width:1000px;
      margin:auto;
      padding:20px 0;
    }

    .card{
      background:rgba(255,255,255,0.06);
      padding:12px;
      border-radius:16px;
      transition:0.2s ease;
      border:1px solid rgba(255,255,255,0.06);
    }

    .card:hover{
      transform:translateY(-2px);
      border-color:rgba(165,180,252,0.22);
    }

    .media-box{
      width:100%;
      height:190px;
      background:black;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .card img{
      width:100%;
      height:100%;
      object-fit:contain;
      cursor:pointer;
      display:block;
    }

    .video-card video{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:12px;
      display:block;
      background:black;
    }

    .title{
      text-align:center;
      margin-top:11px;
      font-size:15px;
      font-weight:bold;
      color:#f3f4f6;
    }

    .sub{
      text-align:center;
      margin-top:4px;
      font-size:11px;
      color:#6b7280;
    }

    .contact{
      text-align:center;
      margin-top:22px;
      padding:20px 18px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:18px;
      max-width:760px;
      margin-left:auto;
      margin-right:auto;
    }

    .contact h2{
      color:#a5b4fc;
      margin-bottom:10px;
      font-size:26px;
    }

    .contact p{
      color:#cbd5e1;
      line-height:1.9;
      font-size:14px;
    }

    .contact a{
      color:#a5b4fc;
      text-decoration:none;
    }

    .contact a:hover{
      text-decoration:underline;
    }

    footer{
      text-align:center;
      margin-top:24px;
      color:#6b7280;
      font-size:13px;
    }

    .popup{
      display:none;
      position:fixed;
      inset:0;
      background:#000000dd;
      justify-content:center;
      align-items:center;
      z-index:999;
      padding:20px;
    }

    .popup.active{
      display:flex;
    }

    .popup img{
      max-width:82%;
      max-height:82%;
      border-radius:12px;
    }

    .close{
      position:absolute;
      top:20px;
      right:30px;
      font-size:30px;
      cursor:pointer;
      color:white;
    }

    @media(max-width:900px){
      .services,
      .grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:700px){
      .services,
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>
<div class="container">

<header>
  <h1>HR Edits</h1>
  <p>Creative Poster & Video Designer</p>

  <div class="hero-box">
    <h2 class="hero-title">Creative Visual Designs That Stand Out</h2>
    <p class="hero-text">
      I design posters and video edits that help brands grab attention and look professional.
    </p>
    <p class="hero-sub">
      Helping brands grow through clean and impactful visuals.
    </p>
  </div>

  <nav>
    <button class="tab active" onclick="show('posters',this)">Posters</button>
    <button class="tab" onclick="show('videos',this)">Videos</button>
  </nav>
</header>

<!-- rest of your code stays SAME -->

</body>
</html>
